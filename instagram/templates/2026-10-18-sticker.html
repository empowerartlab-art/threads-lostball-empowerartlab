<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { background: #fff; }
  /* 本物のステッカー原画から、木と子どもたちの部分だけを切り出す（QRコードは写さない） */
  .art { position: absolute; top: 210px; left: 90px; width: 900px; height: 690px; border-radius: 40px; overflow: hidden; background: #fff; }
  .art img { position: absolute; width: 1020px; left: -60px; top: -470px; }
  .art::after { content:''; position:absolute; left:0; right:0; bottom:0; height:140px; background: linear-gradient(transparent, #fff); }
  .main { position: absolute; top: 940px; left: 90px; font-size: 56px; font-weight: 900; line-height: 1.5; color: var(--ink); }
  .main em { font-style: normal; color: var(--pink); }
  .sub { position: absolute; top: 1110px; left: 90px; font-family: 'Noto Sans JP'; font-size: 27px; color: var(--muted); }
  .footer { bottom: 50px; }
</style></head><body>
  <div class="eyebrow">LOST BALL ／ ひとりじゃないよプロジェクト</div>
  <div class="art"><img src="../../assets/hitori-janai-yo-project/sticker-100x70mm-v2-original.png" alt=""></div>
  <p class="main">ボールに付いている、<br><em>ハートの木</em>のステッカー。</p>
  <p class="sub">売上の一部は「ひとりじゃないよプロジェクト」へ寄付しています。</p>
  <div class="footer"><span><b>手磨きロストボール</b></span><span>empower art lab</span></div>
</body></html>
