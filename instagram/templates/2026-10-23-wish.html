<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { background: #fff; }
  /* 本物のステッカー原画から、木の部分だけを切り出す（QRコードは写さない） */
  .art { position: absolute; top: 200px; left: 240px; width: 600px; height: 560px; border-radius: 40px; overflow: hidden; background: #fff; }
  .art img { position: absolute; width: 900px; left: -150px; top: -420px; }
  .art::after { content:''; position:absolute; left:0; right:0; bottom:0; height:120px; background: linear-gradient(transparent, #fff); }
  .main { position: absolute; top: 800px; left: 90px; font-size: 60px; font-weight: 900; line-height: 1.5; color: var(--ink); }
  .main em { font-style: normal; color: var(--pink); }
  .sub { position: absolute; top: 1010px; left: 90px; font-family: 'Noto Sans JP'; font-size: 30px; line-height: 1.7; color: var(--muted); }
  .footer { bottom: 50px; }
</style></head><body>
  <div class="eyebrow">LOST BALL ／ 一人じゃないよプロジェクト</div>
  <div class="art"><img src="../../assets/hitori-janai-yo-project/sticker-100x70mm-v2-original.png" alt=""></div>
  <p class="main">ひとりで寂しい思いをする子を、<br><em>減らしたい。</em></p>
  <p class="sub">その想いを伝える絵本もつくっている活動です。<br>売上の一部を寄付しています。</p>
  <div class="footer"><span><b>手磨きロストボール</b></span><span>empower art lab</span></div>
</body></html>
