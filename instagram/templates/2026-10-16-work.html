<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { background: var(--green); color: #fff; }
  .eyebrow { color: #d9eadf; }
  .footer { color: #b9d3c3; } .footer b { color: #fff; }
  .steps { position: absolute; top: 230px; left: 90px; right: 90px; display: flex; gap: 22px; }
  .step { flex: 1; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.18); border-radius: 28px; padding: 30px 0; text-align: center; }
  .step .n { font-size: 26px; color: var(--pink); font-weight: 900; letter-spacing: .1em; }
  .step .t { font-size: 40px; font-weight: 700; margin-top: 8px; }
  .main { position: absolute; top: 560px; left: 90px; font-size: 104px; font-weight: 900; line-height: 1.35; }
  .main em { font-style: normal; color: #ffd3e0; }
  .sub { position: absolute; top: 900px; left: 90px; font-size: 36px; line-height: 1.75; color: #e6f1ea; font-weight: 500; }
</style></head><body>
  <div class="eyebrow">LOST BALL ／ 福祉の仕事</div>

    <div class="step"><div class="n">02</div><div class="t">洗う</div></div>
    <div class="step"><div class="n">03</div><div class="t">手で磨く</div></div>
  </div>
  <p class="main"><em>1球ずつ、</em><br>仕事として。</p>
  <p class="sub">磨いているのは、就労継続支援施設で<br>働く、障がいのある方々です。</p>
  <div class="footer"><span><b>手磨きロストボール</b></span><span>empower art lab</span></div>
</body></html>
