<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* 本物の商品写真を使う（AIで作った商品画像は使わない） */
  .photo { position: absolute; inset: 0 0 430px 0; overflow: hidden; }
  .photo img { position: absolute; width: 1900px; left: -700px; top: 0px; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 470px; background: var(--green); border-radius: 48px 48px 0 0; }
  .eyebrow { top: auto; bottom: 380px; color: #d9eadf; }
  .main { position: absolute; bottom: 200px; left: 90px; font-size: 56px; font-weight: 900; line-height: 1.45; color: #fff; }
  .main em { font-style: normal; color: #ffd3e0; }
  .footer { color: #b9d3c3; } .footer b { color: #fff; }
  .tag { position: absolute; top: 60px; right: 60px; background: var(--pink); color: #fff; font-weight: 900; font-size: 30px; padding: 16px 30px; border-radius: 999px; }
</style></head><body>
  <div class="photo"><img src="../../assets/lost-ball-product/day7-product-photo.png" alt=""></div>
  <div class="tag">日本のロストボール</div>
  <div class="panel"></div>
  <div class="eyebrow">LOST BALL ／ ショップ</div>
  <p class="main">練習ラウンドに、<br><em>手で磨いたロストボールを。</em></p>
  <div class="footer"><span><b>プロフィールのリンクから</b></span><span>empower art lab</span></div>
</body></html>
