name: Lost Ball Threads - Weekly Review (候補作成のみ・自動承認なし)

# 毎週土曜日 9:00 JST に実行する週次レビュー。
#
# 行うこと(すべてこのworkflow内で完結):
#   1. data/threads-posts.json の投稿済みthreadsPostIdを使い、Threads APIから
#      投稿単位のInsights(views/likes/replies/reposts/quotes/shares)を取得する
#      (scripts/fetch-threads-insights.mjs。GETのみ。投稿・削除・編集は一切行わない)。
#   2. 取得結果を data/threads-insights-history.json へ取得日時付きで追記する。
#   3. 週次分析(lib/weekly-analysis.mjs)を行い、翌週(次の火曜日〜月曜日)7日分の
#      「候補スケルトン」を生成し、data/draft-bank-candidates.json へ保存する
#      (scripts/weekly-review.mjs)。
#   4. 1〜3で変更したデータファイルのみをcommit/pushする
#      (data/draft-bank.json・data/verified-facts.json・data/threads-posts.jsonには
#      このworkflowから一切書き込まない)。
#   5. Discordへ「候補ができたのでレビューしてください」という通知のみ送る
#      (「投稿予約完了」等、承認・予約が完了したかのような通知は絶対に送らない)。
#
# 絶対に行わないこと:
#   - data/draft-bank.jsonへの書き込み(候補からの昇格はscripts/promote-candidates.mjsによる
#     人間の明示操作(--approvedBy・--yes必須)でのみ行う。このworkflowはそれを一切迂回しない)。
#   - Threads APIへの投稿・削除・編集(scripts/fetch-threads-insights.mjsはGETしか呼ばない
#     lib/threads-client.mjsのgetMediaInsightsのみを使う。createTextContainer等は一切importしない)。
#   - 既存の毎日20:00 JST自動投稿(.github/workflows/daily-live-post.yml)・duplicate guard・
#     verified-fact guard・media guard・approval gate・画像投稿機能への変更
#     (このworkflowはこれらのファイルを一切変更しない)。
#
# Secretsは既存のものを再利用するだけで、新規のSecretsは追加しない
# (THREADS_ACCESS_TOKEN・DISCORD_WEBHOOK_URL・LIVE_DISCORDはdaily-live-post.ymlと同じもの)。

on:
  workflow_dispatch: {}
  schedule:
    # 9:00 JST = UTC 0:00 (JST = UTC+9)。
    - cron: "0 0 * * 6"

concurrency:
  group: lostball-weekly-review
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

defaults:
  run:
    shell: bash

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 依存関係のインストール
        run: npm install

      - name: 構文チェック
        run: npm run check

      - name: テスト
        run: npm test

      - name: データ検証
        run: npm run lostball:validate-data

      - name: Write ephemeral .env.local from GitHub Secrets(コミットしない。job終了時に必ず削除)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          {
            echo "THREADS_ACCESS_TOKEN=${THREADS_ACCESS_TOKEN}"
            echo "THREADS_USER_ID=${THREADS_USER_ID}"
          } > .env.local

      - name: "Insights取得(読み取り専用。1投稿の失敗で全体を止めない)"
        id: insights
        continue-on-error: true
        run: node scripts/fetch-threads-insights.mjs

      - name: Remove ephemeral .env.local(Secretsをディスク上に残さない)
        if: always()
        run: rm -f .env.local

      - name: "週次分析・翌週7候補の生成(draft-bank-candidates.jsonへ保存するだけ。draft-bank.jsonへは書き込まない)"
        id: review
        run: node scripts/weekly-review.mjs

      - name: 変更をcommit/push(data/threads-insights-history.json・data/draft-bank-candidates.jsonのみ)
        id: commit
        continue-on-error: true
        run: |
          git config user.name "lostball-weekly-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/threads-insights-history.json data/draft-bank-candidates.json
          if git diff --cached --quiet; then
            echo "変更なし(commitしません)。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(lostball): weekly insights + next-week candidate skeletons"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Discord通知: 週次レビューの準備ができました(候補のみ。承認・投稿予約は一切行っていません)"
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIVE_DISCORD: ${{ secrets.LIVE_DISCORD }}
          WEEK_START: ${{ steps.review.outputs.weekStartDateKey }}
          WEEK_END: ${{ steps.review.outputs.weekEndDateKey }}
          CANDIDATE_COUNT: ${{ steps.review.outputs.candidateCount }}
          POSTED_COUNT: ${{ steps.review.outputs.postedCount }}
        run: |
          NOTIFIED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          CONTENT="【Lost Ball Threads｜週次レビューの準備ができました】
          実行日時: ${NOTIFIED_AT}
          対象期間: ${WEEK_START} 〜 ${WEEK_END}
          候補件数: ${CANDIDATE_COUNT}件(data/draft-bank-candidates.json。本文は未執筆のプレースホルダーです)
          これまでの投稿実績: ${POSTED_COUNT}件
          Run: ${RUN_URL}

          翌週7投稿の候補を作成しています。内容を確認・承認してください。
          承認済みのものだけが scripts/promote-candidates.mjs 経由で data/draft-bank.json へ昇格し、
          毎日20:00 JSTの既存の自動投稿処理の対象になります(このworkflow自体は投稿・承認を一切行っていません)。"
          node scripts/send-discord-notification.mjs --live --content="$CONTENT"
