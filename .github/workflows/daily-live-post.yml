name: Lost Ball Threads - Daily LIVE Post (Phase 4)
run-name: "${{ inputs.mode == 'tick' && format('Lost Ball Threads tick {0} {1} #{2}', inputs.slot, inputs.date, inputs.tick_id) || github.event_name == 'schedule' && format('Lost Ball Threads schedule {0}', github.event.schedule) || format('Lost Ball Threads manual {0}', inputs.run || 'auto') }}"

# 毎日自動でThreadsへ投稿するworkflow。Phase 3で実証済みの二重ゲート・各種ガード・
# state保存・commit/pushの仕組みを、人間の手動確認(confirm入力)無しで日次スケジュール実行する。
#
# 1日4本(2026-10-20〜。日本語のうち1日1本だけInstagram画像付き、ほかは文字のみ):
#   朝07:35 日本語 / 昼12:35 日本語 / 夜20:35 日本語 / 夜21:00 英語。
#   1回の実行で投稿するのは「その日・その枠」の承認済み1件だけ(lib/slots.mjs / scripts/select-daily-candidate.mjs)。
#   前の枠の取り残しを後の枠で出すことはしない。2026-10-19までは従来どおり(05:00 日本語・21:00 英語)。
#   手動実行(workflow_dispatch)は mode=dry-run が既定で、Threadsへは投稿しない。
#
# 安全設計(Phase 2/3から一切変更していない部分):
#   - 候補選出(scripts/select-daily-candidate.mjs)・各種ガード(bilingual/verified-fact/
#     duplicate/media/claim)・二重ゲート(lib/threads-publish.mjsのisLivePostAllowed)・
#     Threads API呼び出し(lib/threads-client.mjs)・state保存(lib/threads-posts-store.mjs)は
#     すべて既存実装をそのまま呼び出すだけで、このworkflow専用のロジックは一切追加していない。
#   - 投稿済み候補は selectDailyCandidate 内の duplicate-guard により自動的に再選出されない。
#   - Threads APIへのpublish呼び出しの自動リトライは、コンテナ作成(POST /{userId}/threads)
#     の失敗に限り最大1回・約4秒待機して行う(lib/threads-publish.mjsのcreateContainerWithRetry。
#     PRE_POST_FAILURE再発防止策。Threads上に投稿が存在しないと安全に判断できる範囲のみが対象)。
#     実際の公開操作(POST /{userId}/threads_publish)には絶対にリトライを行わない(成功したか
#     不明なケースを二重に試みると二重投稿の実リスクがあるため)。1回リトライしても失敗した場合は
#     従来通りそのまま失敗として終了する(2回目以降の自動リトライは無い)。
#   - data/threads-posts.jsonへのcommit/pushは「投稿成功+state保存成功」の場合にのみ行う。
#   - 「投稿成功+state保存失敗」(POSTED_STATE_SAVE_FAILED)の場合はjobを失敗させ、
#     再実行しないよう明示する(自動リトライの仕組みはこのworkflowにも一切無い)。
#
# Discord通知(投稿結果の確認用。~/threads-harley-solo/.github/workflows/daily-post.yml と
# 同じ設計を読み取り専用で参照し、Harley側のファイルは変更していない):
#   - lib/discord-notifier.mjsの二重ゲート(--live かつ 環境変数 LIVE_DISCORD="true")は
#     Threads投稿側の二重ゲートとは独立している。GitHub Secretsに LIVE_DISCORD="true" を
#     登録しない限り、Discord通知はdry-run(実送信しない)のままになる。
#   - NO_CANDIDATE / DRY_RUN の場合は通知しない(Harleyと同じ方針。何も起きていないため)。
#   - POSTED_STATE_SAVED(投稿成功+state保存成功+commit/push成功)の場合のみ「成功」通知。
#   - POSTED_STATE_SAVE_FAILED、および「投稿成功+state保存成功+commit/push失敗」の場合は、
#     「Threadsへの投稿は成功している可能性があるため再実行禁止」と明記した通知を送る。
#   - PRE_POST_FAILURE(投稿前・投稿処理自体の失敗。Threadsへの投稿は発生していない)の場合は
#     「投稿は行われていない」ことが分かる通知を送る。
#   - Discord通知が失敗しても(例外を投げても)、このworkflow・Threads投稿・state保存・commit/push
#     の成否には一切影響しない(Discord通知はcontinue-on-errorを付けた副次処理として実行する)。
#
# このworkflow固有の安全設計:
#   - schedule実行時は常に --live を渡して実際の投稿を試みる。ただし実際にThreads APIへ
#     接続されるかどうかは、GitHub Secretsに LIVE_POST="true" が登録されているか
#     (=もう一段のゲート)にかかっている。未登録/"true"以外なら常にdry-runのまま。
#   - workflow_dispatch(手動実行)の場合はデフォルトで"検証モード"(dry-run)とし、
#     人間が明示的に mode=live を選択した場合のみ実際に投稿を試みる
#     (schedule実行と違い、こちらは常にliveを試みるわけではない)。
#   - concurrency groupは .github/workflows/live-post-manual.yml と同じ名前
#     (lostball-live-post)を使う。これにより、緊急手動実行(live-post-manual.yml)と
#     日次自動実行(このworkflow)が同時に走って二重投稿することを、
#     GitHub Actions側で構造的に防止する。
#   - .github/workflows/daily-post.yml(Phase 2のdry-run専用・毎日09:00 JST)は
#     一切変更していない。このworkflowとは完全に別物として共存する。
#   - .github/workflows/live-post-manual.yml(確認文字列必須の緊急手動投稿)も
#     一切変更していない。引き続き緊急時・単発テスト用として残す。
#
# EAL側・Harley側・lostball-threads-callbackのファイル・Secrets・リポジトリは一切参照しない。
#
# 2026-10-20 追加(合図 tick と「先に記録」claim。~/projects/sns-posting-standard/reliable-trigger-proposal.md 4-3/4-4):
#   - 外の時計(Cloudflare Worker)が mode=tick + slot + date + tick_id でこのworkflowを起動する。
#     tick は schedule と同じ本番扱いだが、scripts/run-gate.mjs の確認(1回目の実行・本物の枠・今日の日付・
#     枠の時刻の3分前〜60分後・承認済みで未投稿・未解決の記録なし)がすべて通ったときだけ投稿する。
#     通らなければ何もせず緑で終わる(SKIP_REASON)。LIVE_POST Secret が必要なのは今までと同じ。
#   - schedule も同じ時間の範囲(lib/tick-gate.mjs の SLOT_WINDOW)の外で始まったら投稿せず緑で終わる
#     (GitHubの混雑で数時間遅れた cron が、昼の投稿を夕方に出すことを防ぐ)。ただしこれはリポジトリの変数
#     SCHEDULE_LATE_SKIP が "true" のときだけ。既定(未設定)は OFF で、schedule は従来どおり(遅れても投稿する)。
#     手動実行は今までどおり(範囲は当てない)。
#   - live の実行は、Threads API を呼ぶ前に data/threads-journal.json へ予約(claim)を push する
#     (scripts/threads-claim.mjs)。未解決の記録(claimed / unknown)があると、以後の本番の実行は全部の枠
#     (英語の night_en も)で止まる。人が Threads を目で確認して scripts/threads-resolve.mjs で閉じるまで。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run(検証のみ・投稿しない) / live(実際に投稿を試みる。LIVE_POST Secretが必要) / tick(外の時計からの合図専用。人は選ばない)"
        required: true
        type: choice
        options:
          - dry-run
          - live
          - tick
        default: dry-run
      run:
        description: "確認する枠。auto = 今の時刻から決める / morning=朝7:35 / noon=昼12:35 / night=夜20:35 / night_en=英語21:00 / legacy_ja=従来の日本語5:00(10/19まで)"
        required: true
        type: choice
        options:
          - auto
          - morning
          - noon
          - night
          - night_en
          - legacy_ja
        default: auto
      date:
        description: "確認したい日付 YYYY-MM-DD(dry-runのときだけ有効。空なら今日)。tick のときは合図の日付(JST・今日でなければ投稿しない)"
        required: false
        type: string
      slot:
        description: "tick only: morning / noon / night / night_en(手動実行では使わない。手動は上の run)"
        required: false
        type: string
      tick_id:
        description: "tick only: id from the external clock, logged"
        required: false
        type: string
  schedule:
    # 時刻はJST(= UTC+9。夏時間なし)。GitHub Actionsのcron式はUTC基準。
    # どの枠で動くかは、下の「枠の決定」stepが github.event.schedule(起動したcronの文字列)から決める
    # (時刻から推測しないので、GitHubの混雑で起動が遅れても枠を取り違えない)。
    # この5つの文字列は lib/slots.mjs の RUNS と一字一句同じでなければならない(tests/slots.test.mjs で確認)。
    #
    # 2026-10-20〜: 1日4本(画像は日本語の1本だけ。lib/slots.mjs の slotMediaProblem)。data/draft-bank.json の slot / lang 付きの投稿を、その日・その枠の1件だけ出す。
    - cron: "35 22 * * *"   # JST 07:35 朝・日本語(UTC上は前日22:35)
    - cron: "35 3 * * *"    # JST 12:35 昼・日本語
    - cron: "35 11 * * *"   # JST 20:35 夜・日本語
    - cron: "0 12 * * *"    # JST 21:00 夜・英語(今までの英語と同じ時刻。10/19までは従来の英語、10/20からは夜・英語の枠)
    # 2026-10-19まで: slot の無い従来の投稿を、朝は日本語だけ・夜は英語だけで出す(2026-10-10〜の運用)。
    - cron: "0 20 * * *"    # JST 05:00 従来の日本語(UTC上は前日20:00)。10/20以降は何もせず終わる(消しても害はない)
    # このworkflowはGitHub Secretsに LIVE_POST="true" が登録されていない限り
    # scheduleで動いてもdry-run相当のままなので、時刻変更自体に投稿リスクは無い。

# Threads投稿だけのconcurrency group(live-post-manual.yml・threads-diagnostic.yml と共有。
# Instagram・X・週次レビュー・insightsはそれぞれ別のgroup)。cancel-in-progress: false なので、
# 走っている実行は絶対に取り消されず、後から来た実行は待つ(同時に2本走って二重投稿することがない)。
# GitHubは1つのgroupに「待ち」を1本しか置かないため、他のworkflow(土曜07:07の週次レビュー等)と
# groupを共有すると、待っている枠の実行が取り消されるおそれがある。だからThreads投稿専用のgroupにしている。
# 他のworkflowと同時にpushがぶつかった場合は、下の commit/push step が最新のリモートに記録を追記し直して最大5回やり直す
# (scripts/push-records.mjs。rebase の衝突では止まらない)。
concurrency:
  group: lostball-live-post
  cancel-in-progress: false

jobs:
  daily-live-post:
    runs-on: ubuntu-latest
    # data/threads-posts.jsonのcommit/push用にcontents: writeが必要
    # (daily-post.ymlはcontents: readのまま変更していない)。
    permissions:
      contents: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 依存関係のインストール
        run: npm install

      - name: 構文チェック
        run: npm run check

      - name: テスト
        run: npm test

      - name: データ検証
        run: npm run lostball:validate-data

      - name: 実行モードの判定(schedule・tick は常にlive試行。手動実行はmode=liveの時のみ。投稿するかは下の Run gate も見る)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.mode }}" = "live" ] || [ "${{ github.event.inputs.mode }}" = "tick" ]; then
            echo "live_flag=--live" >> "$GITHUB_OUTPUT"
            echo "このrunはlive投稿を試みます(実際に投稿されるかは LIVE_POST Secret 次第)。"
          else
            echo "live_flag=" >> "$GITHUB_OUTPUT"
            echo "このrunは検証モード(dry-run)です。Threads APIへは接続しません。"
          fi

      # 枠(run)と対象日(JST)をここで1回だけ決める(読み取りのみ)。後のstepはこの値だけを使う。
      #   schedule: 起動したcronの文字列(github.event.schedule)で決まる。対象日は「その枠の時刻が最後に来た日」。
      #   手動実行: 入力の run(autoなら今の時刻から)。date入力は dry-run のときだけ使う(liveでは常に今日)。
      #   tick: 入力の slot(date入力は使わない。対象日は常に今日。合図の date が今日かは Run gate が確かめる)。
      # 投稿する枠が無い(例: 手動autoを05:00前に実行)ときは has_run=false で、投稿stepは動かない。
      - name: 枠の決定(どの枠・どの日の投稿か)
        id: resolve
        env:
          RUN_SCHEDULE: ${{ github.event.schedule }}
          RUN_INPUT: ${{ github.event.inputs.mode == 'tick' && github.event.inputs.slot || github.event.inputs.run }}
          RUN_DATE_INPUT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'dry-run') && github.event.inputs.date || '' }}
          RUN_MODE: ${{ github.event.inputs.mode || '' }}
        run: node scripts/resolve-run.mjs

      # RUN_GO を決める(lib/tick-gate.mjs の SLOT_WINDOW = 枠の時刻の3分前〜60分後)。
      #   schedule: vars.SCHEDULE_LATE_SKIP == 'true' のときだけ、枠の時刻の範囲の外で始まったら投稿しない(既定は OFF＝従来どおり)。tick: scripts/run-gate.mjs の確認がすべて通ったときだけ。
      #   手動: 今までどおり(RUN_GO=true)。RUN_GO=false の実行は予約も投稿も通知もせず、緑で終わる。
      - name: Run gate(この実行が投稿してよいか)
        env:
          RUN_MODE: ${{ github.event.inputs.mode || '' }}
          TICK_SLOT: ${{ github.event.inputs.slot || '' }}
          TICK_DATE: ${{ github.event.inputs.date || '' }}
          TICK_ID: ${{ github.event.inputs.tick_id || '' }}
          # リポジトリの変数。未設定（既定）= OFF：schedule には時刻の範囲を当てない（遅れた cron も従来どおり投稿）。
          # 外の時計（tick）が安定したら "true" にする。tick にはいつも範囲を当てる。手動実行には当てない。
          SCHEDULE_LATE_SKIP: ${{ vars.SCHEDULE_LATE_SKIP || '' }}
          RUN_SLOT: ${{ steps.resolve.outputs.run }}
          RUN_DATE: ${{ steps.resolve.outputs.date }}
        run: node scripts/run-gate.mjs --media threads

      - name: Git identity(予約・記録の push 用)
        if: env.RUN_GO == 'true' && steps.resolve.outputs.has_run == 'true' && steps.mode.outputs.live_flag == '--live'
        run: |
          git config user.name "lostball-daily-live-post-bot"
          git config user.email "actions@users.noreply.github.com"

      # Threads API を呼ぶ前に、この枠で出す1件の予約を data/threads-journal.json に書いて push し、読み戻す。
      # 予約できない(未解決の記録で停止中・push できない)ときは失敗で終わり、下の投稿 step は動かない。
      # LIVE_POST Secret が "true" でなければ(=dry-run 相当)何も予約しない。
      - name: この枠の投稿を予約(claim)
        id: claim
        if: env.RUN_GO == 'true' && steps.resolve.outputs.has_run == 'true' && steps.mode.outputs.live_flag == '--live'
        env:
          LIVE_POST: ${{ secrets.LIVE_POST }}
          THREADS_RUN: ${{ steps.resolve.outputs.run }}
          TARGET_DATE: ${{ steps.resolve.outputs.date }}
        run: node scripts/threads-claim.mjs --live

      - name: Write ephemeral .env.local from GitHub Secrets(コミットしない。job終了時に必ず削除)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          {
            echo "THREADS_ACCESS_TOKEN=${THREADS_ACCESS_TOKEN}"
            echo "THREADS_USER_ID=${THREADS_USER_ID}"
          } > .env.local

      - name: "投稿実行(二重ゲート: secrets.LIVE_POST=\"true\" + --live。揃わなければ常にdry-run)"
        id: publish
        if: env.RUN_GO == 'true' && steps.resolve.outputs.has_run == 'true'
        env:
          LIVE_POST: ${{ secrets.LIVE_POST }}
          THREADS_CLAIMED: ${{ steps.claim.outputs.claimed }}
        # --claim: live のときは、上の予約が GitHub 上にあることを API を呼ぶ直前に確かめ、結果を journal に残す。
        run: node scripts/post-to-threads.mjs ${{ steps.mode.outputs.live_flag }} --claim --run=${{ steps.resolve.outputs.run }} --date=${{ steps.resolve.outputs.date }} | tee daily-live-post-result.log

      - name: Remove ephemeral .env.local(Secretsをディスク上に残さない)
        if: always()
        run: rm -f .env.local

      - name: daily-live-post-result.logをartifactとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lostball-daily-live-post-log
          path: daily-live-post-result.log
          retention-days: 30

      # ここから下は、outcomeがPOSTED_STATE_SAVED / POSTED_STATE_SAVE_FAILED /
      # PRE_POST_FAILUREのいずれかにならない限り実質的に何も行われない
      # (dry-run/検証モード/候補なしの場合は常にDRY_RUN/NO_CANDIDATEにしかならない)。
      #
      # 注意(GitHub Actionsの仕様): 「投稿実行」stepはPOSTED_STATE_SAVE_FAILED/PRE_POST_FAILUREの
      # 場合に非ゼロ終了する。ifに success()/failure()/always() 等の状態確認関数を含めない条件は
      # 暗黙に success() が前提となり、前のstepが失敗しているとスキップされてしまうため、
      # これらのケースに対応するstepには明示的に failure() を付けている
      # (POSTED_STATE_SAVEDの場合は「投稿実行」step自体が成功しているため不要)。

      - name: data/threads-posts.jsonをcommit/push(投稿成功+state保存成功の場合のみ。予約の結果 published も一緒に)
        id: commit-state
        if: steps.publish.outputs.outcome == 'POSTED_STATE_SAVED' && env.RUN_GO == 'true'
        continue-on-error: true
        env:
          RUN_ID: ${{ steps.resolve.outputs.run }}
          RUN_DATE: ${{ steps.resolve.outputs.date }}
        run: |
          git config user.name "lostball-daily-live-post-bot"
          git config user.email "actions@users.noreply.github.com"
          # 予約(data/threads-journal.json)の published も同じ commit で push する。push できなければ予約は開いたまま
          # (以後の本番の実行は止まる。人が scripts/threads-resolve.mjs --outcome published で閉じる)。
          # Instagram・X・週次レビュー・insights や、同じ日の別の枠(夜の日本語と英語など)が先にpushしていても
          # 記録を落とさないよう、scripts/push-records.mjs が「この実行で足した記録」を覚えておき、毎回
          # 最新のリモートのファイルを読み直して追記し直してからpushする(最大5回)。2026-10-21 のような
          # pull --rebase の衝突(同じ配列の末尾に両方が追記)では止まらない(lib/record-push.mjs)。
          # やり直すのは記録のpushだけ。Threadsへの投稿は絶対にやり直さない。
          node scripts/push-records.mjs --message "chore(lostball): record Threads post (${RUN_DATE} ${RUN_ID})" data/threads-posts.json data/threads-journal.json

      - name: "Discord通知: 投稿成功(state保存・commit/push成功)"
        if: steps.publish.outputs.outcome == 'POSTED_STATE_SAVED' && steps.commit-state.outcome == 'success' && env.RUN_GO == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIVE_DISCORD: ${{ secrets.LIVE_DISCORD }}
          RUN_LABEL: ${{ steps.resolve.outputs.label }}
          RUN_DATE: ${{ steps.resolve.outputs.date }}
          SOURCE_ITEM_ID: ${{ steps.publish.outputs.sourceItemId }}
          THREADS_POST_ID: ${{ steps.publish.outputs.threadsPostId }}
          POST_BODY: ${{ steps.publish.outputs.body }}
          CONTAINER_RETRY_ATTEMPTED: ${{ steps.publish.outputs.containerRetryAttempted }}
          CONTAINER_RETRY_COUNT: ${{ steps.publish.outputs.containerRetryCount }}
          CONTAINER_FIRST_ATTEMPT_ERROR_MESSAGE: ${{ steps.publish.outputs.containerFirstAttemptErrorMessage }}
        run: |
          POSTED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          RETRY_NOTE=""
          if [ "${CONTAINER_RETRY_ATTEMPTED}" = "true" ]; then
            RETRY_NOTE="
          コンテナ作成: 1回目失敗 → 自動リトライで成功(${CONTAINER_RETRY_COUNT}回リトライ)
          1回目のエラー: ${CONTAINER_FIRST_ATTEMPT_ERROR_MESSAGE}"
          fi
          CONTENT="【Lost Ball Threads｜自動投稿成功】
          投稿日時: ${POSTED_AT}
          枠: ${RUN_DATE} ${RUN_LABEL}
          投稿候補ID: ${SOURCE_ITEM_ID}
          Threads投稿ID: ${THREADS_POST_ID}
          Run: ${RUN_URL}
          state保存・commit/pushまで正常終了しました。${RETRY_NOTE}

          --- 投稿本文 ---
          ${POST_BODY}"
          node scripts/send-discord-notification.mjs --live --content="$CONTENT"

      - name: "Discord通知: 投稿は成功したがstate保存に失敗(再実行禁止)"
        if: failure() && steps.publish.outputs.outcome == 'POSTED_STATE_SAVE_FAILED' && env.RUN_GO == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIVE_DISCORD: ${{ secrets.LIVE_DISCORD }}
          RUN_LABEL: ${{ steps.resolve.outputs.label }}
          RUN_DATE: ${{ steps.resolve.outputs.date }}
          SOURCE_ITEM_ID: ${{ steps.publish.outputs.sourceItemId }}
          THREADS_POST_ID: ${{ steps.publish.outputs.threadsPostId }}
          ERROR_MESSAGE: ${{ steps.publish.outputs.errorMessage }}
        run: |
          FAILED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          CONTENT="【Lost Ball Threads｜自動投稿 要確認】
          失敗日時: ${FAILED_AT}
          枠: ${RUN_DATE} ${RUN_LABEL}
          投稿候補ID: ${SOURCE_ITEM_ID}
          Threads投稿ID: ${THREADS_POST_ID}
          失敗段階: state保存(data/threads-posts.jsonへの記録)
          エラー概要: ${ERROR_MESSAGE}
          Run: ${RUN_URL}

          Threadsへの投稿は成功している可能性があるため再実行禁止。
          人間がThreadsの実アカウントを直接確認したうえで、手動でdata/threads-posts.jsonへ記録を追記してください。"
          node scripts/send-discord-notification.mjs --live --content="$CONTENT"

      - name: 警告(投稿は成功したがstate保存に失敗。再実行禁止。ログ出力もこのstepで行う)
        if: failure() && steps.publish.outputs.outcome == 'POSTED_STATE_SAVE_FAILED' && env.RUN_GO == 'true'
        run: |
          echo "::error::Threadsへの投稿自体は成功しましたが、data/threads-posts.jsonへの記録に失敗しました。"
          echo "::error::【再実行禁止】このworkflowの次回スケジュール実行より前に、人間の確認が必要です。"
          echo "::error::人間がThreadsの実アカウント(@lost_ball_empowerartlab)を直接確認し、投稿の存在を確認したうえで、"
          echo "::error::data/threads-posts.json へ手動で記録を追記し、通常のgit操作でcommit/pushしてください。"
          exit 1

      - name: "Discord通知: 投稿・state保存は成功したがcommit/pushに失敗(再実行禁止)"
        if: steps.publish.outputs.outcome == 'POSTED_STATE_SAVED' && steps.commit-state.outcome == 'failure' && env.RUN_GO == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIVE_DISCORD: ${{ secrets.LIVE_DISCORD }}
          RUN_LABEL: ${{ steps.resolve.outputs.label }}
          RUN_DATE: ${{ steps.resolve.outputs.date }}
          SOURCE_ITEM_ID: ${{ steps.publish.outputs.sourceItemId }}
          THREADS_POST_ID: ${{ steps.publish.outputs.threadsPostId }}
        run: |
          FAILED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          CONTENT="【Lost Ball Threads｜自動投稿 要確認】
          失敗日時: ${FAILED_AT}
          枠: ${RUN_DATE} ${RUN_LABEL}
          投稿候補ID: ${SOURCE_ITEM_ID}
          Threads投稿ID: ${THREADS_POST_ID}
          失敗段階: data/threads-posts.jsonのcommit/push
          Run: ${RUN_URL}

          Threadsへの投稿・ローカルstate保存までは成功しているため再実行禁止。
          人間がdata/threads-posts.jsonの内容を確認し、手動でcommit/pushしてください。"
          node scripts/send-discord-notification.mjs --live --content="$CONTENT"

      - name: 警告(投稿・state保存は成功したがcommit/pushに失敗。再実行禁止。ログ出力のみ)
        if: steps.publish.outputs.outcome == 'POSTED_STATE_SAVED' && steps.commit-state.outcome == 'failure' && env.RUN_GO == 'true'
        run: |
          echo "::error::Threadsへの投稿・ローカルstate保存までは成功しましたが、commit/pushに失敗しました。"
          echo "::error::【再実行禁止】人間が data/threads-posts.json の内容を確認し、手動でcommit/pushしてください。"
          exit 1

      - name: "Discord通知: 投稿前または投稿処理自体の失敗(Threadsへの投稿は行われていない)"
        if: failure() && steps.publish.outputs.outcome == 'PRE_POST_FAILURE' && env.RUN_GO == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIVE_DISCORD: ${{ secrets.LIVE_DISCORD }}
          RUN_LABEL: ${{ steps.resolve.outputs.label }}
          RUN_DATE: ${{ steps.resolve.outputs.date }}
          SOURCE_ITEM_ID: ${{ steps.publish.outputs.sourceItemId }}
          FAILURE_REASON: ${{ steps.publish.outputs.failureReason }}
          ERROR_MESSAGE: ${{ steps.publish.outputs.errorMessage }}
          JOURNAL_STAGE: ${{ steps.publish.outputs.journalStage }}
          CONTAINER_RETRY_ATTEMPTED: ${{ steps.publish.outputs.containerRetryAttempted }}
          CONTAINER_RETRY_COUNT: ${{ steps.publish.outputs.containerRetryCount }}
          CONTAINER_FIRST_ATTEMPT_ERROR_MESSAGE: ${{ steps.publish.outputs.containerFirstAttemptErrorMessage }}
        run: |
          FAILED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          RETRY_NOTE=""
          if [ "${CONTAINER_RETRY_ATTEMPTED}" = "true" ]; then
            RETRY_NOTE="
          コンテナ作成: 1回目失敗 → ${CONTAINER_RETRY_COUNT}回リトライも失敗
          1回目のエラー: ${CONTAINER_FIRST_ATTEMPT_ERROR_MESSAGE}"
          fi
          # 予約(data/threads-journal.json)の結果で、最後の案内を変える。
          #   unknown*        … 公開(threads_publish)の呼び出しが失敗。出たか不明。予約は開いたまま
          #   *-not-persisted … 予約を閉じる記録を push できなかった。予約は開いたまま
          #   left-open       … 予約を確認できなかった(未解決の記録で停止中など)。API は呼んでいない
          case "${JOURNAL_STAGE}" in
            unknown*)
              CLOSING="公開の呼び出しが失敗しました。Threadsに出たかは不明です。【再実行禁止】
          Threadsを目で確認し、node scripts/threads-resolve.mjs --id ${SOURCE_ITEM_ID} --outcome published|not-published --by <名前> --yes で閉じるまで、Threadsの本番投稿は全部の枠で止まります。" ;;
            *-not-persisted)
              CLOSING="Threadsへの投稿は行われていませんが、予約を閉じる記録をpushできませんでした。
          node scripts/threads-resolve.mjs --id ${SOURCE_ITEM_ID} --outcome not-published --by <名前> --yes で閉じるまで、Threadsの本番投稿は全部の枠で止まります。" ;;
            left-open)
              CLOSING="予約を確認できなかったため、Threadsへの投稿は行っていません(未解決の記録があれば、閉じるまで全部の枠で止まります)。" ;;
            *)
              CLOSING="Threadsへの投稿は行われていません。再実行しても二重投稿にはなりません。" ;;
          esac
          CONTENT="【Lost Ball Threads｜自動投稿失敗】
          失敗日時: ${FAILED_AT}
          枠: ${RUN_DATE} ${RUN_LABEL}
          投稿候補ID: ${SOURCE_ITEM_ID:-(未選出)}
          失敗段階: ${FAILURE_REASON:-投稿処理呼び出し}
          エラー概要: ${ERROR_MESSAGE}${RETRY_NOTE}
          予約の記録: ${JOURNAL_STAGE:-none}
          Run: ${RUN_URL}

          ${CLOSING}"
          node scripts/send-discord-notification.mjs --live --content="$CONTENT"

      - name: 投稿前または投稿処理自体の失敗(Threadsへの投稿は行われていない)
        if: failure() && steps.publish.outputs.outcome == 'PRE_POST_FAILURE' && env.RUN_GO == 'true'
        env:
          JOURNAL_STAGE: ${{ steps.publish.outputs.journalStage }}
        run: |
          if [ "${JOURNAL_STAGE#unknown}" != "${JOURNAL_STAGE}" ]; then
            echo "::error::公開(threads_publish)の呼び出しが失敗しました。Threadsに出たかは不明です(再実行禁止)。"
            echo "::error::Threadsを目で確認し、scripts/threads-resolve.mjs で data/threads-journal.json の記録を閉じるまで、Threadsの本番投稿は止まります。"
          else
            echo "::error::Threadsへの投稿前、または投稿処理自体が失敗しました(Threadsへの投稿は行われていません)。予約の記録: ${JOURNAL_STAGE:-none}"
          fi
          echo "詳細は上の「投稿実行」stepのログ、またはartifact(lostball-daily-live-post-log)を確認してください。"
          exit 1

      # 予約(claim)の step が失敗した: 未解決の記録で停止中、または予約を push できなかった。Threads API は呼んでいない。
      - name: "Discord通知: 予約(claim)できず投稿していない(未解決の記録で停止中を含む)"
        if: failure() && env.RUN_GO == 'true' && steps.claim.outcome == 'failure'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIVE_DISCORD: ${{ secrets.LIVE_DISCORD }}
          RUN_LABEL: ${{ steps.resolve.outputs.label }}
          RUN_DATE: ${{ steps.resolve.outputs.date }}
          CLAIM_REASON: ${{ steps.claim.outputs.reason }}
        run: |
          FAILED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          CONTENT="【Lost Ball Threads｜投稿を止めました(予約できず)】
          日時: ${FAILED_AT}
          枠: ${RUN_DATE} ${RUN_LABEL}
          理由: ${CLAIM_REASON:-不明}
          Run: ${RUN_URL}

          Threadsへの投稿は行っていません。
          open-claim(未解決の記録)の場合: Threadsを目で確認し、node scripts/threads-resolve.mjs --id <postId> --outcome published|not-published --by <名前> --yes で閉じるまで、Threadsの本番投稿は全部の枠で止まります。"
          node scripts/send-discord-notification.mjs --live --content="$CONTENT"

      - name: 予約(claim)できず投稿していない(ログ出力)
        if: failure() && env.RUN_GO == 'true' && steps.claim.outcome == 'failure'
        run: |
          echo "::error::予約(claim)できなかったため、Threadsへの投稿は行っていません(上の「この枠の投稿を予約」stepのログ参照)。"
          echo "::error::未解決の記録がある場合は、Threadsを目で確認してから scripts/threads-resolve.mjs で閉じてください。このworkflowをそのまま再実行しないでください。"
          exit 1

      # 投稿 step が outcome を出さずに失敗した(想定外のエラー)。予約していれば開いたまま(出たか分からないため)。
      - name: "Discord通知: 投稿処理が想定外のエラーで止まった(要確認)"
        if: failure() && env.RUN_GO == 'true' && ((steps.publish.outcome == 'failure' && steps.publish.outputs.outcome == '') || (steps.claim.outputs.claimed == 'true' && steps.publish.outcome == 'skipped'))
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIVE_DISCORD: ${{ secrets.LIVE_DISCORD }}
          RUN_LABEL: ${{ steps.resolve.outputs.label }}
          RUN_DATE: ${{ steps.resolve.outputs.date }}
        run: |
          FAILED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          CONTENT="【Lost Ball Threads｜自動投稿 要確認(想定外のエラー)】
          失敗日時: ${FAILED_AT}
          枠: ${RUN_DATE} ${RUN_LABEL}
          Run: ${RUN_URL}

          再実行禁止。Threadsを目で確認してください。予約(data/threads-journal.json)が開いたままなら、scripts/threads-resolve.mjs で閉じるまでThreadsの本番投稿は止まります。"
          node scripts/send-discord-notification.mjs --live --content="$CONTENT"

      - name: 完了サマリ
        if: steps.publish.outputs.outcome == 'POSTED_STATE_SAVED' && steps.commit-state.outcome == 'success' && env.RUN_GO == 'true'
        run: |
          echo "Threadsへの投稿、state保存、commit/pushすべて成功しました。"
