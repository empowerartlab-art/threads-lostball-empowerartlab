name: Comment Auto Reply

# Threads のコメントに自動で返信する（lib/comment-autoreply.mjs）。2026-11-09 代表決定。
# ふつうのコメントは AI が返信、迷うものは返さずに暗号化して受け箱へ → sns-daily-digest が LINE で代表へ。
# 止めるとき：リポジトリの Variables の AUTO_REPLY を off にする（全部 LINE に回るだけになる）。
# ログは件数だけ（コメント本文・返信文は出さない）。
on:
  schedule:
    # UTC。JST 9:21 / 12:51 / 18:21 / 21:51
    - cron: "21 0,9 * * *"
    - cron: "51 3,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comment-autoreply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reply to new comments
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_REPLY: ${{ vars.AUTO_REPLY }}
        run: node scripts/comment-autoreply.mjs

      - name: Commit handled ids / encrypted inbox (only if changed)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/comment-autoreply.json data/comment-inbox.enc.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "Record comment auto reply"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "push failed 5 times"
          exit 1
